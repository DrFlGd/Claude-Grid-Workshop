[dependencies.proc-macro2]
default-features = false
version = "1.0.91"

[dependencies.quote]
default-features = false
optional = true
version = "1.0.35"

[dependencies.unicode-ident]
version = "1"

[dev-dependencies.anyhow]
version = "1"

[dev-dependencies.automod]
version = "1"

[dev-dependencies.insta]
version = "1"

[dev-dependencies.ref-cast]
version = "1"

[dev-dependencies.rustversion]
version = "1"

[dev-dependencies.syn-test-suite]
version = "0"

[dev-dependencies.termcolor]
version = "1"

[features]
clone-impls = []
default = ["derive", "parsing", "printing", "clone-impls", "proc-macro"]
derive = []
extra-traits = []
fold = []
full = []
parsing = []
printing = ["dep:quote"]
proc-macro = ["proc-macro2/proc-macro", "quote?/proc-macro"]
test = ["syn-test-suite/all-features"]
visit = []
visit-mut = []

[lib]
path = "src/lib.rs"

[package]
authors = ["David Tolnay <dtolnay@gmail.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["development-tools::procedural-macro-helpers", "parser-implementations"]
description = "Parser for Rust source code"
documentation = "https://docs.rs/syn"
edition = "2021"
include = ["/benches/**", "/Cargo.toml", "/LICENSE-APACHE", "/LICENSE-MIT", "/README.md", "/src/**", "/tests/**"]
keywords = ["macros", "syn"]
license = "MIT OR Apache-2.0"
name = "syn"
readme = "README.md"
repository = "https://github.com/dtolnay/syn"
rust-version = "1.71"
version = "2.0.119"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition", "--generate-macro-expansion", "--extend-css=src/gen/token.css", "--extern-html-root-url=core=https://doc.rust-lang.org", "--extern-html-root-url=alloc=https://doc.rust-lang.org", "--extern-html-root-url=std=https://doc.rust-lang.org", "--extern-html-root-url=proc_macro=https://doc.rust-lang.org"]
targets = ["x86_64-unknown-linux-gnu"]

[package.metadata.playground]
features = ["full", "visit", "visit-mut", "fold", "extra-traits"]

[target."cfg(not(miri))".dev-dependencies.flate2]
version = "1"

[target."cfg(not(miri))".dev-dependencies.rayon]
version = "1"

[target."cfg(not(miri))".dev-dependencies.reqwest]
features = ["blocking"]
version = "0.13"

[target."cfg(not(miri))".dev-dependencies.tar]
version = "0.4.16"

[target."cfg(not(miri))".dev-dependencies.walkdir]
version = "2.3.2"
