name: Windows render timing experiment

# Temporary: why are Gridfinity Extended models ~15x slower with native OpenSCAD on Windows?
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/win-perf.yml"]

jobs:
  probe:
    runs-on: windows-2022
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Engine
        run: python tools/fetch_native_engine.py --out eng
      - name: Time variants
        run: |
          set +e
          EXE=$(ls eng/*/openscad.exe)
          export OPENSCADPATH="$PWD/vendor/libraries"
          F=vendor/gridfinity-extended/gridfinity_basic_cup.scad
          t() { local name=$1; shift; local s=$(date +%s.%N); "$@" > "log-$name.txt" 2>&1; local rc=$?; local e=$(date +%s.%N); echo "$name $(python -c "print(round($e-$s,2))")s rc=$rc" | tee -a times.txt; }
          t stl        "$EXE" --backend=Manifold -o a.stl "$F"
          t stl-again  "$EXE" --backend=Manifold -o a.stl "$F"
          t echo       "$EXE" -o a.echo "$F"
          t ast        "$EXE" -o a.ast "$F"
          t csg        "$EXE" -o a.csg "$F"
          t version    "$EXE" --version
          mkdir -p fc && printf '<?xml version="1.0"?>\n<fontconfig>\n<dir>WINDOWSFONTDIR</dir>\n<cachedir>%s</cachedir>\n</fontconfig>\n' "$(cygpath -m "$PWD/fc")" > fc/fonts.conf
          FONTCONFIG_FILE="$(cygpath -m "$PWD/fc/fonts.conf")" t stl-fc1 "$EXE" --backend=Manifold -o a.stl "$F"
          FONTCONFIG_FILE="$(cygpath -m "$PWD/fc/fonts.conf")" t stl-fc2 "$EXE" --backend=Manifold -o a.stl "$F"
          printf 'cube(10);\n' > c.scad
          t cube "$EXE" -o c.stl c.scad
          printf 'text("Ab", font="Liberation Sans");\n' > tx.scad
          t text "$EXE" -o tx.stl tx.scad
          t text-again "$EXE" -o tx.stl tx.scad
          printf 'function f(n) = n <= 0 ? 0 : 1 + f(n - 1);\nx = [for (i = [0:20000]) f(200)];\necho(len(x));\ncube(1);\n' > ev.scad
          t evaluate "$EXE" -o ev.stl ev.scad
          echo "::notice title=times::$(tr '\n' ' ' < times.txt)"
          for f in log-stl.txt log-echo.txt log-text.txt; do echo "::notice title=$f::$(tail -c 900 $f | tr '\n' ' ')"; done
