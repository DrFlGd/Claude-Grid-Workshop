name: Fetch OpenSCAD WASM engine

# Downloads an OpenSCAD WebAssembly build and stores it on the engine-cache
# branch with its checksum, so it can be inspected and pinned in engine.json.
on:
  workflow_dispatch:
    inputs:
      version: { description: "OpenSCAD snapshot version", default: "2026.01.19" }
  push:
    branches: [main]
    paths: [".github/workflows/fetch-engine.yml"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - name: Download and record
        env:
          VERSION: ${{ inputs.version || '2026.01.19' }}
        run: |
          mkdir out && cd out
          curl -fsSL -o engine.zip "https://files.openscad.org/snapshots/OpenSCAD-${VERSION}-WebAssembly-web.zip"
          sha256sum engine.zip | tee SHA256
          unzip -q engine.zip -d unpacked && find unpacked -maxdepth 2 | tee FILES
          # newest WebAssembly snapshots currently listed
          curl -fsSL https://files.openscad.org/snapshots/ | grep -o 'OpenSCAD-[0-9.]*-WebAssembly-web.zip' | sort -u | tail -8 | tee AVAILABLE
          echo "${VERSION}" > VERSION
          rm -rf unpacked
          echo "::notice title=engine::$(cat SHA256) | $(tr '\n' ' ' < AVAILABLE)"
          git init -q && git checkout -q -b engine-cache
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "OpenSCAD ${VERSION} WebAssembly"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" engine-cache
