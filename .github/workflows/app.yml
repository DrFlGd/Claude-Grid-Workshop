name: Website

on:
  push:
    branches: [main]
    paths: ["app/**", "web/**", "libraries/**", "tests/**", "catalog/**", "adapters/**", "Dockerfile", "requirements.txt", ".github/workflows/app.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # screenshots are pushed to the ci-screenshots branch for review

jobs:
  end-to-end:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSCAD development snapshot
        run: |
          wget -qO- https://files.openscad.org/OBS-Repository-Key.pub | sudo tee /etc/apt/trusted.gpg.d/obs-openscad-nightly.asc > /dev/null
          echo "deb https://download.opensuse.org/repositories/home:/t-paul/xUbuntu_24.04/ ./" | sudo tee /etc/apt/sources.list.d/openscad-nightly.list
          sudo apt-get update -qq && sudo apt-get install -y -qq openscad-nightly
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt playwright pytest
          python -m playwright install --with-deps chromium
      - name: API tests with the real engine
        env: { OPENSCAD: openscad-nightly, TEST_MODEL: gridfinity-rebuilt/bin }
        run: python -m pytest tests/test_api.py -q
      - name: Browser run over every model
        env: { OPENSCAD: openscad-nightly, GW_WORKERS: "4" }
        run: |
          uvicorn app.main:app --port 8000 > server.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          MODELS=$(curl -s localhost:8000/api/models | python -c "import json,sys;print(' '.join(m['key'] for c in json.load(sys.stdin)['categories'] for m in c['models']))")
          python tests/screenshots.py --base http://localhost:8000 --out shots $MODELS
      - name: Publish screenshots to ci-screenshots branch
        if: always() && github.event_name != 'pull_request'
        run: |
          [ -d shots ] || exit 0
          cp server.log shots/ 2>/dev/null || true
          cd shots
          git init -q && git checkout -q -b ci-screenshots
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t grid-workshop .
      - name: Run container and render one model
        run: |
          docker run -d --name gw -p 8000:8000 grid-workshop
          for i in $(seq 40); do curl -sf localhost:8000/api/health && break; sleep 1; done
          JOB=$(curl -sf -X POST localhost:8000/api/render -H 'Content-Type: application/json' -d '{"model":"gridfinity-rebuilt/baseplate","params":{}}')
          ID=$(echo "$JOB" | python3 -c "import json,sys;print(json.load(sys.stdin)['id'])")
          for i in $(seq 120); do
            S=$(curl -sf localhost:8000/api/jobs/$ID); ST=$(echo "$S" | python3 -c "import json,sys;print(json.load(sys.stdin)['status'])")
            [ "$ST" = done ] && break; [ "$ST" = failed ] && { echo "$S"; exit 1; }; sleep 2; done
          URL=$(echo "$S" | python3 -c "import json,sys;print(json.load(sys.stdin)['download_url'])")
          curl -sf "localhost:8000$URL" -o part.stl && ls -la part.stl && test -s part.stl
          echo "::notice title=Docker::container rendered $(stat -c%s part.stl) bytes"
