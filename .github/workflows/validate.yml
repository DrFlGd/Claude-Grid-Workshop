name: Validate generators

on:
  push:
    branches: [main]
    paths: ["vendor/**", "adapters/**", "catalog/**", "tools/**", ".github/workflows/validate.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Verify vendored source checksums
        run: python3 tools/validate_sources.py --hashes-only

      - name: Install OpenSCAD development snapshot
        run: |
          wget -qO- https://files.openscad.org/OBS-Repository-Key.pub | sudo tee /etc/apt/trusted.gpg.d/obs-openscad-nightly.asc > /dev/null
          echo "deb https://download.opensuse.org/repositories/home:/t-paul/xUbuntu_24.04/ ./" | sudo tee /etc/apt/sources.list.d/openscad-nightly.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq openscad-nightly
          openscad-nightly --version

      - name: Check parameter extraction is current
        run: |
          python3 tools/extract_params.py --all
          git diff --exit-code catalog/params || (echo "::error::catalog/params is stale; run tools/extract_params.py --all" && exit 1)

      - name: Render every catalog model (STL, default parameters)
        env:
          OPENSCAD: openscad-nightly
        run: python3 tools/validate_sources.py --stl --jobs 4 --output validation.json

      - name: Compare generators with published parts
        continue-on-error: true
        env:
          OPENSCAD: openscad-nightly
        run: |
          python3 -m pip install --quiet --break-system-packages numpy
          python3 tools/parity.py --output parity.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            validation.json
            parity.json
          if-no-files-found: ignore
