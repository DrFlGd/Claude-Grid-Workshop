[package]
name = "claude-grid-workshop"
description = "Claude Grid Workshop desktop app"
version.workspace = true
edition.workspace = true
default-run = "claude-grid-workshop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync"] }
workshop-core = { path = "../core" }
