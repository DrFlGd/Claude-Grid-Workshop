[package]
name = "workshop-core"
description = "Native rendering, cache, workspace and storage for the Claude Grid Workshop desktop app"
version.workspace = true
edition.workspace = true

[lib]
name = "workshop_core"

[[bin]]
name = "workshop-cli"
path = "src/bin/workshop-cli.rs"

[dependencies]
anyhow = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros", "time", "fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
